<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single Studio Companion</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f5; --card: #fff; --text: #18181b; --muted: #71717a; --border: #e4e4e7;
    --accent: #2563eb; --ok: #15803d;
    --err-bg: #fef2f2; --err-border: #fecaca; --err-text: #991b1b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b; --card: #18181b; --text: #fafafa; --muted: #a1a1aa; --border: #3f3f46;
      --accent: #3b82f6; --ok: #4ade80;
      --err-bg: #2a1215; --err-border: #7f1d1d; --err-text: #fca5a5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; min-height: 100vh;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; align-items: flex-start;
  }
  main {
    width: 100%; max-width: 380px; padding: 20px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  }
  h1 { font-size: 16px; margin: 0 0 16px; }
  .label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  select {
    width: 100%; padding: 8px; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  #power-label { font-weight: 600; }
  #status { font-size: 13px; color: var(--muted); }
  #status.live { color: var(--ok); }

  .switch { position: relative; flex: none; width: 52px; height: 30px; }
  .switch input { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .switch input:disabled { cursor: not-allowed; }
  .switch span { position: absolute; inset: 0; border-radius: 15px; background: var(--border); transition: background .15s; }
  .switch span::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .3); transition: transform .15s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(22px); }
  .switch input:disabled + span { opacity: .5; }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .meta { margin-top: 14px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

  .pane {
    margin-top: 16px; padding: 10px 12px; border-radius: 6px;
    background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err-text);
  }
  .pane[hidden] { display: none; }
  .pane header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 4px; }
  .pane button { padding: 0; font: inherit; font-size: 12px; color: inherit; background: none; border: 0; text-decoration: underline; cursor: pointer; }
  .pane ul { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; }
  .pane li { padding: 5px 0; font-size: 13px; border-top: 1px solid var(--err-border); }
  .pane li:first-child { border-top: 0; }
  .pane time { margin-right: 6px; opacity: .8; font-variant-numeric: tabular-nums; }
  .pane .count { margin-left: 4px; opacity: .8; }
</style>
</head>
<body>
<main>
  <h1>Single Studio Companion</h1>

  <label class="label" for="game">Game</label>
  <select id="game">
    <option value="" disabled>Choose a game…</option>
  </select>

  <div class="row">
    <div>
      <div id="power-label">Off</div>
      <div id="status">Not relaying</div>
    </div>
    <label class="switch">
      <input id="power" type="checkbox" role="switch" aria-labelledby="power-label">
      <span></span>
    </label>
  </div>

  <div class="meta" id="meta"></div>

  <section class="pane" id="offline" hidden>
    The companion has stopped. Start it again, then reload this page.
  </section>

  <section class="pane" id="errors" hidden aria-live="polite">
    <header><span>Errors</span><button id="clear" type="button">Clear</button></header>
    <ul id="error-list"></ul>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let busy = false, populated = false, shownErrors = "";

  async function post(path, body) {
    busy = true;
    try {
      await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
    } catch {}
    busy = false;
    refresh();
  }

  function ago(ts) {
    const s = Math.max(0, Math.round((Date.now() - Date.parse(ts)) / 1000));
    return s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`;
  }

  function render(st) {
    const game = $("game");
    if (!populated) {
      for (const g of st.games) {
        const opt = new Option(g.available ? g.name : `${g.name} (coming soon)`, g.id);
        opt.disabled = !g.available;
        game.add(opt);
      }
      populated = true;
    }
    if (document.activeElement !== game) game.value = st.game || "";
    game.disabled = false;

    const power = $("power");
    power.checked = st.running;
    power.disabled = !st.game;
    $("power-label").textContent = st.running ? "On" : "Off";

    const name = (st.games.find((g) => g.id === st.game) || {}).name;
    const status = $("status");
    status.classList.toggle("live", st.running && !!st.lastData);
    status.textContent = !st.running ? "Not relaying"
      : st.lastData ? `Receiving data · updated ${ago(st.lastData)}`
      : `Waiting for ${name}…`;

    const overlays = st.clients === 1 ? "1 overlay" : `${st.clients} overlays`;
    $("meta").textContent = `Single Studio connects to ${st.relay} · ${overlays} connected`;

    const key = JSON.stringify(st.errors);
    if (key !== shownErrors) {
      shownErrors = key;
      const list = $("error-list");
      list.replaceChildren(...st.errors.map((e) => {
        const li = document.createElement("li");
        const time = document.createElement("time");
        time.dateTime = e.time;
        time.textContent = new Date(e.time).toLocaleTimeString();
        li.append(time, e.message);
        if (e.count > 1) {
          const count = document.createElement("span");
          count.className = "count";
          count.textContent = `×${e.count}`;
          li.append(count);
        }
        return li;
      }));
      $("errors").hidden = st.errors.length === 0;
    }
  }

  async function refresh() {
    if (busy) return;
    try {
      const res = await fetch("/api/state");
      if (!res.ok) throw new Error(res.statusText);
      $("offline").hidden = true;
      render(await res.json());
    } catch {
      $("offline").hidden = false;
      $("game").disabled = true;
      $("power").disabled = true;
    }
  }

  $("game").addEventListener("change", (e) => { post("/api/game", { game: e.target.value }); e.target.blur(); });
  $("power").addEventListener("change", (e) => post(e.target.checked ? "/api/start" : "/api/stop"));
  $("clear").addEventListener("click", () => post("/api/errors/clear"));

  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
